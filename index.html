<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link href="style.css" rel="stylesheet">
  
  <title>Frontend Mentor | Social links profile</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body>
  <main class="links-card">
    <article class="profile-pic">
      <img src="./assets/images/avatar-me.jpg" alt="A self-picture of me, in a beanie with several game and anime pins on my hat." class="rounded-[50%]"/>
    </article>

    <section class="card-text">
      <article class="profile-name">
        <h1>Joshua Williams</h1>
      </article>
      <article class="location">
        <h2>Maryland, United States</h2>
      </article>
      <article class="descript">
        <p>"Front-end developer and avid gamer."</p>
      </article>
    </section>

    <article class="socials-buttons">
      <a href="https://github.com/AzureAcademia715" id="github-btn" type="button">Github</a>
      <a href="https://www.frontendmentor.io/home" id="frontend-mentor-btn" type="button">Frontend Mentor</a>
      <a href="https://www.linkedin.com/in/joshua-williams-18185a104/" id="linkedin-btn" type="button">LinkedIn</a>
      <a href="https://www.instagram.com/azuredge_19/" id="instagram-btn" type="button">Instagram</a>
      <a href="https://azureacademia715.github.io/HTML-web-portfolio/" id="webpage-btn" type="button">My Webpage</a>
    </article>
  
  </main>
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="https://azureacademia715.github.io/HTML-web-portfolio/">Joshua Williams</a>.
  </footer>
</body>
</html>
